<a-scene
  webxr="optionalFeatures: hit-test; mode: ar"
  ar-hit-test
  renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  embedded
>
  <a-camera position="0 0 0" look-controls></a-camera>

  <a-entity
    id="reticle"
    geometry="primitive: ring, radiusInner: 0.05, radiusOuter: 0.06"
    material="color: green; shader: flat"
    position="0 0 -1"
    visible="false"
  >
  </a-entity>

  <a-entity
    id="model"
    gltf-model="assets/model.glb"
    scale="0.5 0.5 0.5"
    visible="false"
  ></a-entity>
</a-scene>
